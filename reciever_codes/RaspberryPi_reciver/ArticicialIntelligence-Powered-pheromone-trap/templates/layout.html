<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pest Analytics | {% block title %}Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Google Fonts for professional typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="{% block body_class %}{% endblock %}">

    {% if page != 'landing' %}
    <nav class="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-spider header-icon"></i>
            <span class="brand-text">PEST ANALYTICS</span>
        </div>
        <a href="{{ url_for('dashboard') }}" class="nav-link {% if page == 'dashboard' %}active{% endif %}">
            <i class="fas fa-chart-line"></i>
            <span class="link-text">Overview</span>
        </a>
        <a href="{{ url_for('fields_list') }}" class="nav-link {% if page == 'fields' %}active{% endif %}">
            <i class="fas fa-map-marked-alt"></i>
            <span class="link-text">Fields</span>
        </a>
        <a href="{{ url_for('images') }}" class="nav-link {% if page == 'images' %}active{% endif %}">
            <i class="fas fa-images"></i>
            <span class="link-text">Images</span>
        </a>
        <a href="{{ url_for('developers') }}" class="nav-link {% if page == 'developers' %}active{% endif %}">
            <i class="fas fa-code"></i>
            <span class="link-text">Developers</span>
        </a>
        <a href="{{ url_for('technology') }}" class="nav-link {% if page == 'technology' %}active{% endif %}">
            <i class="fas fa-microchip"></i>
            <span class="link-text">Technology</span>
        </a>
        <a href="{{ url_for('landing') }}" class="nav-link">
            <i class="fas fa-sign-out-alt"></i>
            <span class="link-text">Logout (Home)</span>
        </a>
    </nav>
    {% endif %}

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    {% block scripts %}{% endblock %}
</body>

</html>
