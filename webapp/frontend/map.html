<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Map - OrchardEye</title>
    <link rel="stylesheet" href="style.css">
    <!-- Leaflet JS and CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>
<body class="map-page-layout">
    <header>
        <div class="nav-container">
            <div class="brand-wrapper">
                <img src="Assets/Caiml.png" alt="CAIML Logo" class="brand-logo">
                <span class="brand-title">OrchardEye</span>
            </div>
            <nav class="options">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="map.html" class="active">Live Map</a></li>
                    <li><a href="data.html">Collected Data</a></li>
                    <li><a href="request-api.html">Request API</a></li>
                    <li><a href="admin.html">Admin Panel</a></li>
                    <li><a href="about.html">About Us</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="admin-header">
            <div>
                <h1 style="font-size: 2.2rem;">Live Trap Monitoring Map</h1>
                <p style="color: var(--text-secondary); font-size: 0.95rem;">Trap locations with installation details and captured images</p>
            </div>
        </div>

        <div id="map-error-msg" class="alert alert-danger" style="display: none; margin-bottom: 20px;"></div>

        <div id="map"></div>
    </main>

    <footer>
        <div>
            <p>Developed at SKUAST-K CAIML (Center for AI & Machine Learning)</p>
            <p style="font-size: 0.8rem; margin-top: 4px; color: var(--text-muted);">&copy; 2026 OrchardEye Project. All rights reserved.</p>
        </div>
    </footer>

    <script>
        const API_BASE = "http://localhost:8000";
        let map;
        let trapsData = [];
        let capturedImages = [];

        document.addEventListener("DOMContentLoaded", () => {
            initMapApp();
        });

        async function initMapApp() {
            try {
                const [trapsRes, capturesRes] = await Promise.all([
                    fetch(`${API_BASE}/traps`),
                    fetch(`${API_BASE}/map/captures`)
                ]);

                if (!trapsRes.ok || !capturesRes.ok) {
                    throw new Error("Failed to fetch map data");
                }

                trapsData = await trapsRes.json();
                capturedImages = await capturesRes.json();
                renderMap();
            } catch (err) {
                console.error(err);
                const errorBox = document.getElementById("map-error-msg");
                errorBox.textContent = "Could not load map data. Please verify your backend server connection.";
                errorBox.style.display = "block";
            }
        }

        function buildImagesHtml(trapId) {
            const trapCaptures = capturedImages.filter(c => c.trap_id === trapId && c.image_url);

            if (trapCaptures.length === 0) {
                return `<p style="color: var(--text-muted); margin-top: 8px;"><i>No images captured yet</i></p>`;
            }

            const imagesHtml = trapCaptures.map(capture => `
                <div style="margin-top: 10px;">
                    <p style="font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 6px;">${capture.timestamp}</p>
                    <img src="${API_BASE}${capture.image_url}" alt="Capture from ${trapId}" style="width: 100%; border-radius: 8px;" />
                </div>
            `).join("");

            return `
                <div style="margin-top: 10px;">
                    <p><b>Images Captured (${trapCaptures.length})</b></p>
                    <div style="max-height: 240px; overflow-y: auto;">${imagesHtml}</div>
                </div>
            `;
        }

        function renderMap() {
            let centerLat = 34.0837;
            let centerLng = 74.7973;
            let zoomLevel = 10;

            if (trapsData.length > 0) {
                centerLat = trapsData[0].latitude;
                centerLng = trapsData[0].longitude;
                zoomLevel = 12;
            }

            map = L.map("map").setView([centerLat, centerLng], zoomLevel);

            L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
                subdomains: "abcd",
                maxZoom: 20
            }).addTo(map);

            trapsData.forEach(trap => {
                const marker = L.marker([trap.latitude, trap.longitude]).addTo(map);

                const popupContent = `
                    <div class="map-popup-detail">
                        <h4>${trap.trap_id}</h4>
                        <p><b>Installation Date:</b> ${trap.install_date || "N/A"}</p>
                        ${buildImagesHtml(trap.trap_id)}
                    </div>
                `;

                marker.bindPopup(popupContent);
            });
        }
    </script>
</body>
</html>
