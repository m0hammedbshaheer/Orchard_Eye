<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request API Access - OrchardEye</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="nav-container">
            <div class="brand-wrapper">
                <img src="Assets/Caiml.png" alt="CAIML Logo" class="brand-logo">
                <span class="brand-title">OrchardEye</span>
            </div>
            <nav class="options">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="map.html">Live Map</a></li>
                    <li><a href="data.html">Collected Data</a></li>
                    <li><a href="request-api.html" class="active">Request API</a></li>
                    <li><a href="admin.html">Admin Panel</a></li>
                    <li><a href="about.html">About Us</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container" style="max-width: 500px; padding-top: 60px;">
        <div class="glass-card text-center">
            <h1 style="font-size: 2.2rem; margin-bottom: 8px;">Request API Access</h1>
            <h2 style="font-size: 0.95rem; margin-bottom: 30px;">Get a User ID and API key to view maps and collect data</h2>

            <div id="alert-success" class="alert alert-success" style="display: none;"></div>
            <div id="alert-danger" class="alert alert-danger" style="display: none;"></div>

            <form id="request-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
                </div>
                <button type="submit" id="submit-btn" class="btn">Request Credentials</button>
            </form>
        </div>
    </main>

    <footer>
        <div>
            <p>Developed at SKUAST-K CAIML (Center for AI & Machine Learning)</p>
            <p style="font-size: 0.8rem; margin-top: 4px; color: var(--text-muted);">&copy; 2026 OrchardEye Project. All rights reserved.</p>
        </div>
    </footer>

    <script>
        const API_BASE = "http://localhost:8000";

        document.getElementById('request-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const emailInput = document.getElementById('email');
            const submitBtn = document.getElementById('submit-btn');
            const successAlert = document.getElementById('alert-success');
            const dangerAlert = document.getElementById('alert-danger');

            // Hide previous alerts
            successAlert.style.display = 'none';
            dangerAlert.style.display = 'none';

            // Disable form submission
            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';

            try {
                const response = await fetch(`${API_BASE}/api/request-api`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email: emailInput.value.trim() })
                });

                const data = await response.json();

                if (response.ok && data.status === 'success') {
                    successAlert.textContent = data.message;
                    successAlert.style.display = 'block';
                    emailInput.value = '';
                } else {
                    dangerAlert.textContent = data.detail || data.message || 'An error occurred. Please try again.';
                    dangerAlert.style.display = 'block';
                }
            } catch (err) {
                console.error(err);
                dangerAlert.textContent = 'Unable to connect to the backend server. Is the API running?';
                dangerAlert.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Request Credentials';
            }
        });
    </script>
</body>
</html>
